# MADELARME, тестовый домен madelarme.seoweb.kz. Перед nginx стоит общий Caddy (HTTPS, сжатие).
# Заголовки безопасности: тот же набор, что в scripts/static.htaccess; политика CSP — src/lib/security.ts.
# Домен тестовый, поэтому X-Robots-Tag запрещает индексацию. На боевом домене эту строку убрать.

map $uri $madelarme_cache {
    default                                "no-cache";
    ~^/_next/static/                       "public, max-age=31536000, immutable";
    ~*\.(?:mp4|webp|woff2|ico)$            "public, max-age=2592000";
}

server {
    listen 8080;
    server_name _;
    absolute_redirect off;
    root /var/www/current;
    index index.html;
    charset utf-8;
    autoindex off;

    add_header X-Robots-Tag "noindex, nofollow, noarchive, nosnippet, noimageindex" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; media-src 'self' blob:; connect-src 'self'; frame-src https://www.youtube-nocookie.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), browsing-topics=()" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Cache-Control $madelarme_cache always;

    error_page 404 /404.html;

    location = /__health { access_log off; return 204; }
    location ~* (?:^|/)\. { return 404; }
    location ~* \.(?:php[0-9]?|phtml|phar|sql|env|sh|py|service|conf|md|zip|tar|gz|tgz|7z|rar)$ { return 404; }
    location / { try_files $uri $uri/ $uri.html =404; }
}
